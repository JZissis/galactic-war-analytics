app:
  version: "@project.version@"
spring:
  application:
    name: galactic.war.analytics.platform
  profiles:
    default: dev
  threads:
    virtual:
      # Safe since JDK 24 (JEP 491): synchronized blocks no longer pin virtual threads to carriers.
      # Request handling and @Scheduled jobs then block cheaply on API retries and rate-limit waits.
      enabled: true

helldivers-api-rest:
  base-url: https://api.helldivers2.dev
  super-client: galactic-war-analytics-platform
  super-contact: https://github.com/JZissis/galactic-war-analytics
  connection-manager-metrics-tag: helldivers-api
  # The /raw endpoints proxy ArrowHead's servers and often take 5-10s to answer. Read and socket
  # timeouts must cover that, or every attempt is cut off and retries cannot help.
  read-timeout-millis: 10000
  socket-timeout-millis: 10000
  endpoints:
    raw:
      current-war-id-url: /raw/api/WarSeason/current/WarID
      current-war-status-url: /raw/api/WarSeason/{warId}/Status
      current-war-info-url: /raw/api/WarSeason/{warId}/WarInfo
      current-war-summary-url: /raw/api/Stats/war/{warId}/summary
      news-feed-url: /raw/api/NewsFeed/{warId}
      active-assignments-url: /raw/api/v2/Assignment/War/{warId}
      space-station-info-url: /raw/api/v2/SpaceStation/War/{warId}/{index}
    v1:
      current-war-state-url: /api/v1/war
      available-assignments-url: /api/v1/assignments # for a specific assignment, append /{index}
      available-campaigns-url: /api/v1/campaigns # for a specific campaign, append /{index}
      available-dispatches-url: /api/v1/dispatches # for a specific dispatch, append /{index}
      planet-info-url: /api/v1/planets # for a specific planet, append /{index}
      planet-events-url: /api/v1/planet-events
      steam-news-feed-url: /api/v1/steam # for a specific news item, append /{gid} - this is the Steam GID
    v2:
      available-dispatches-url: /api/v2/dispatches # for a specific dispatch, append /{index}
      space-station-info-url: /api/v2/space-stations # for a specific space station, append /{index}
